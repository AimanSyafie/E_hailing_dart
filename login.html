<!DOCTYPE html>

<html>

<head>

    <title>Dart Dashboard Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body class="login-body">

<div class="login-box">

    <h1>Dart Dashboard</h1>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <select name="role">

            <option value="management">
                Management
            </option>

            <option value="driver">
                Driver
            </option>

            <option value="customer">
                Customer
            </option>

        </select>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

    <p class="error-msg">
        {{ error }}
    </p>

    {% endif %}

</div>

</body>

</html>
